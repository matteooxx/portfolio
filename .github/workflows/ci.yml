name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      # JavaScript syntax, required assets, local contact service, static page
      # references, claim boundaries, Cloudflare export allowlist, and the
      # public phone/CV privacy boundary. Nothing is deployed.
      - name: Run checks
        run: make check
